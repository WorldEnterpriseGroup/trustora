<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Trustora — Employer of Record and employee intelligence</title>
  <desc id="desc">Trustora brand social share graphic with global trust layers and employee intelligence signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f6f7"/>
      <stop offset="100%" stop-color="#d9e8f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b63b32"/>
      <stop offset="100%" stop-color="#9b2f2b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="74" width="1040" height="482" rx="26" fill="#0b2740" opacity="0.95" />
  <rect x="118" y="118" width="964" height="394" fill="url(#accent)" opacity="0.17" />

  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="160" y="220" font-size="54" font-weight="500" letter-spacing="0.5">Trustora</text>
    <text x="160" y="290" font-size="80" font-weight="700">Employer of Record</text>
    <text x="160" y="366" font-size="72" font-weight="400">with Employee Intelligence</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#ffffff" opacity="0.95">
    <text x="160" y="448" font-size="33" font-weight="500" letter-spacing="0.3">Specialist talent, global reliability,</text>
    <text x="160" y="495" font-size="33" font-weight="500" letter-spacing="0.3">across the EU, Australia, and USA.</text>
  </g>

  <g fill="#ffffff" opacity="0.72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M860 210 L920 210 L950 176 L1010 176" />
    <path d="M860 250 L940 250 L980 214" />
    <path d="M860 290 L930 290" />
    <path d="M860 330 L1006 330 L1040 296" />
    <path d="M860 370 L905 370 L905 414" />
  </g>

  <g fill="#f5f6f7" opacity="0.95">
    <text x="160" y="575" font-size="28" font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="0.5">trustora.net</text>
  </g>
