name: Publish Trustora site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CAREERS_API_URL: ${{ vars.PUBLIC_CAREERS_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: npm install --global pnpm@11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: |
          pnpm run check
          pnpm run build
          pnpm test
          for forbidden in '.claude' '.mcp.json' 'CLAUDE.md' 'plan.md' '.gitlab-ci.yml' 'docs' 'package.json' 'pnpm-lock.yaml'; do
            if [ -e "dist/$forbidden" ]; then
              echo "Forbidden repository file copied into Pages artifact: $forbidden"
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
