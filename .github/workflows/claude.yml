name: Claude
on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Claude Code Action
        uses: anthropics/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # Maximum tools - all available tools and MCP tools
          allowed_tools: |
            Edit,
            MultiEdit,
            Glob,
            Grep,
            LS,
            Read,
            Write,
            WebSearch,
            WebFetch,
            TodoWrite,
            NotebookRead,
            NotebookEdit,
            exit_plan_mode,
            Task,
            Bash(*),
            mcp_github_comment__update_claude_comment,
            mcp__sequential-thinking__sequentialthinking,
            mcp__memory__create_memory,
            mcp__memory__retrieve_memory,
            mcp__memory__search_memories,
            mcp__memory__list_memories,
            mcp__memory__delete_memory,
            mcp__memory__delete_all_memories,
            mcp__memory__count_memories,
            mcp__filesystem__read_file,
            mcp__filesystem__write_file,
            mcp__filesystem__list_directory,
            mcp__filesystem__delete_file,
            mcp__filesystem__move_file,
            mcp__filesystem__make_directory,
            mcp__filesystem__file_info,
            mcp__everything__*,
            mcp__puppeteer__*,
            mcp__postgres__*,
            mcp__github__*
          
          # All available MCP servers
          mcp_config: |
            {
              "mcpServers": {
                "filesystem": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-filesystem", "/home/runner/work"]
                },
                "memory": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-memory"]
                },
                "sequential-thinking": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
                },
                "everything": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-everything"]
                },
                "puppeteer": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-puppeteer"]
                }
              }
            }
          
          # Additional configurations
          trigger_phrase: "@claude"
          base_branch: gh-pages
          branch_prefix: "claude/"
          use_commit_signing: false
          
          # Enable all experimental features
          experimental_enabled: true
          use_plan_mode: true
          
          # Maximum capabilities
          max_turns: 50
          timeout_minutes: 120
          
          # Enhanced instructions
          custom_instructions: |
            You have access to ALL available tools and MCP servers including:
            - Filesystem operations with advanced features
            - Memory management with knowledge graphs
            - Sequential thinking for complex problems
            - Browser automation with Puppeteer
            - Everything server for testing all MCP features
            - Web search and fetching capabilities
            - Full bash access with all commands
            - Notebook editing capabilities
            
            Use all available tools to provide the most comprehensive assistance possible.