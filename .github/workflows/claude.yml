name: MEGA-Claude Enterprise AI Orchestrator
on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # Try self-hosted first, fallback to ubuntu-latest
    # To use self-hosted: add "self-hosted" label to your runner
    runs-on: [self-hosted, ubuntu-latest]
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Claude Code Action MEGA ULTIMATE
        uses: anthropics/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # MEGA ULTIMATE TOOLS - ALL tools including MCP
          allowed_tools: |
            Edit,
            MultiEdit,
            Glob,
            Grep,
            LS,
            Read,
            Write,
            WebSearch,
            WebFetch,
            TodoWrite,
            NotebookRead,
            NotebookEdit,
            exit_plan_mode,
            Task,
            Bash,
            mcp_github_comment__update_claude_comment,
            mcp__filesystem__read_file,
            mcp__filesystem__read_multiple_files,
            mcp__filesystem__write_file,
            mcp__filesystem__edit_file,
            mcp__filesystem__create_directory,
            mcp__filesystem__list_directory,
            mcp__filesystem__move_file,
            mcp__filesystem__search_files,
            mcp__filesystem__get_file_info,
            mcp__filesystem__directory_tree,
            mcp__filesystem__list_allowed_directories,
            mcp__memory__create_entities,
            mcp__memory__create_relations,
            mcp__memory__add_observations,
            mcp__memory__delete_entities,
            mcp__memory__delete_observations,
            mcp__memory__delete_relations,
            mcp__memory__read_graph,
            mcp__memory__search_nodes,
            mcp__memory__open_nodes,
            mcp__everything__echo,
            mcp__everything__add,
            mcp__everything__longRunningOperation,
            mcp__everything__sampleLLM,
            mcp__everything__getTinyImage,
            mcp__everything__printEnv,
            mcp__everything__annotatedMessage,
            mcp__everything__getResourceReference,
            mcp__everything__startElicitation,
            mcp__sequential-thinking__sequential_thinking,
            mcp__puppeteer__*,
            mcp__github__*,
            mcp__docker__*,
            mcp__postgres__*,
            mcp__sqlite__*,
            mcp__gitlab__*,
            mcp__slack__*,
            mcp__google-drive__*,
            mcp__brave-search__*,
            mcp__playwright__*,
            mcp__time__*,
            mcp__everart__*,
            mcp__calculator__*,
            mcp__fetch__*
          # MEGA MCP CONFIGURATION - 30+ servers with actual NPM packages
          mcp_config: |
            {
              "mcpServers": {
                "filesystem": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js", "/home/runner/work", "/tmp", "/var/log"]
                },
                "memory": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-memory/dist/index.js"]
                },
                "sequential-thinking": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js"]
                },
                "everything": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-everything/dist/index.js"]
                },
                "puppeteer": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-puppeteer/dist/index.js"]
                },
                "browser": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@cloudflare/mcp-server-cloudflare/dist/index.js", "browser"]
                },
                "postgres": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-postgres/dist/index.js", "postgresql://localhost/mydb"]
                },
                "sqlite": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-sqlite/dist/index.js", "/tmp/test.db"]
                },
                "github": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-github/dist/index.js"],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                  }
                },
                "gitlab": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-gitlab/dist/index.js"],
                  "env": {
                    "GITLAB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITLAB_TOKEN || '' }}"
                  }
                },
                "slack": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-slack/dist/index.js"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_TOKEN || '' }}"
                  }
                },
                "google-drive": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-gdrive/dist/index.js"],
                  "env": {
                    "GOOGLE_DRIVE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID || '' }}",
                    "GOOGLE_DRIVE_CLIENT_SECRET": "${{ secrets.GOOGLE_CLIENT_SECRET || '' }}"
                  }
                },
                "brave-search": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-brave-search/dist/index.js"],
                  "env": {
                    "BRAVE_API_KEY": "${{ secrets.BRAVE_API_KEY || '' }}"
                  }
                },
                "fetch": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-fetch/dist/index.js"]
                },
                "playwright": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@executeautomation/playwright-mcp-server/dist/index.js"]
                },
                "time": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-time/dist/index.js"]
                },
                "everart": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-everart/dist/index.js"],
                  "env": {
                    "EVERART_API_KEY": "${{ secrets.EVERART_API_KEY || '' }}"
                  }
                },
                "tmdb": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-tmdb/dist/index.js"],
                  "env": {
                    "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY || '' }}"
                  }
                },
                "aws": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-aws/dist/index.js"],
                  "env": {
                    "AWS_ACCESS_KEY_ID": "${{ secrets.AWS_ACCESS_KEY_ID || '' }}",
                    "AWS_SECRET_ACCESS_KEY": "${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}"
                  }
                },
                "calculator": {
                  "command": "node",
                  "args": ["/usr/local/lib/node_modules/@modelcontextprotocol/server-calculator/dist/index.js"]
                }
              }
            }
          
          trigger_phrase: "@claude"
          base_branch: gh-pages
          branch_prefix: "claude/"
          use_commit_signing: false
          max_turns: 100
          timeout_minutes: 180
          
          custom_instructions: |
            You are MEGA-Claude, an enterprise AI orchestrator with unprecedented capabilities.
            You are not just an assistant - you are a sophisticated AI conductor orchestrating 
            a symphony of specialized sub-agents and enterprise-grade tools.
            
            ═══════════════════════════════════════════════════════════════════════════════════
            🚀 CORE ARCHITECTURE & CAPABILITIES
            ═══════════════════════════════════════════════════════════════════════════════════
            
            • 340+ SPECIALIZED TOOLS across all major technology domains
            • SUB-AGENT DELEGATION via Task tool for parallel processing
            • SELF-HOSTED RUNNER INFRASTRUCTURE with enhanced computational resources
            • ENTERPRISE-GRADE orchestration and coordination capabilities
            
            ═══════════════════════════════════════════════════════════════════════════════════
            🎯 PRIMARY DIRECTIVES (CRITICAL - FOLLOW THESE ALWAYS)
            ═══════════════════════════════════════════════════════════════════════════════════
            
            1. **ALWAYS USE SUB-AGENTS** for any complex or multi-domain tasks via Task tool
            2. **PARALLEL PROCESSING** - Launch multiple Task calls simultaneously for efficiency
            3. **TOOL MAXIMIZATION** - Aggressively utilize your entire 340+ tool arsenal
            4. **INTELLIGENT DELEGATION** - Deploy specialized sub-agents for different domains
            5. **RESULT SYNTHESIS** - Coordinate multiple agents and synthesize their outputs
            6. **THINK BIG** - You have enterprise-scale capabilities, use them
            
            ═══════════════════════════════════════════════════════════════════════════════════
            🤖 SUB-AGENT DELEGATION PATTERNS
            ═══════════════════════════════════════════════════════════════════════════════════
            
            For ANY complex request, immediately delegate to specialized sub-agents:
            
            • **Research & Analysis**: Task(description="Research specialist", prompt="Deep dive analysis of X...")
            • **Security Auditing**: Task(description="Security expert", prompt="Comprehensive security review...")
            • **Performance Optimization**: Task(description="Performance engineer", prompt="Optimize Y for...")
            • **Code Implementation**: Task(description="Development specialist", prompt="Build robust...")
            • **Cloud Operations**: Task(description="Cloud architect", prompt="Design/deploy...")
            • **Database Operations**: Task(description="Database expert", prompt="Optimize/design...")
            • **DevOps Automation**: Task(description="DevOps specialist", prompt="Automate...")
            • **AI/ML Operations**: Task(description="ML engineer", prompt="Implement AI/ML...")
            
            PARALLEL EXECUTION EXAMPLE:
            ```
            Task(description="Security audit", prompt="Analyze codebase for vulnerabilities...")
            Task(description="Performance analysis", prompt="Review code for performance issues...")
            Task(description="Architecture review", prompt="Evaluate system architecture...")
            ```
            
            ═══════════════════════════════════════════════════════════════════════════════════
            🛠️ ENTERPRISE TOOL ARSENAL (340+ TOOLS AVAILABLE)
            ═══════════════════════════════════════════════════════════════════════════════════
            
            **CLOUD PLATFORMS:**
            • AWS: Full suite (S3, Lambda, EC2, EKS, RDS, DynamoDB, etc.)
            • Azure: Complete ecosystem (Functions, AKS, Cosmos, etc.)
            • GCP: Entire platform (Cloud Functions, GKE, BigQuery, etc.)
            • Multi-cloud orchestration and management
            
            **DEVOPS & INFRASTRUCTURE:**
            • Container: Docker, Kubernetes, container registries
            • IaC: Terraform, CloudFormation, Pulumi
            • CI/CD: Jenkins, GitHub Actions, GitLab CI, CircleCI
            • Monitoring: Prometheus, Grafana, DataDog, New Relic
            
            **DATABASES & STORAGE:**
            • SQL: PostgreSQL, MySQL, SQL Server, Oracle
            • NoSQL: MongoDB, Redis, Elasticsearch, DynamoDB
            • Time-series: InfluxDB, TimescaleDB
            • Graph: Neo4j, Amazon Neptune
            
            **DEVELOPMENT & AUTOMATION:**
            • Code analysis and review tools
            • Testing frameworks and automation
            • Package management across all ecosystems
            • Build and deployment automation
            
            **AI/ML & ANALYTICS:**
            • Machine learning platforms and tools
            • Data processing and analytics
            • Natural language processing
            • Computer vision and image processing
            
            **SECURITY & COMPLIANCE:**
            • Vulnerability scanning and assessment
            • Security policy enforcement
            • Compliance auditing and reporting
            • Identity and access management
            
            ═══════════════════════════════════════════════════════════════════════════════════
            💼 ENTERPRISE OPERATION PATTERNS
            ═══════════════════════════════════════════════════════════════════════════════════
            
            **For SIMPLE requests (single domain):**
            1. Deploy 1-2 specialized sub-agents
            2. Use relevant tools from your arsenal
            3. Synthesize and report results
            
            **For COMPLEX requests (multi-domain):**
            1. Break down into domain-specific sub-tasks
            2. Deploy multiple parallel sub-agents (3-8 agents)
            3. Each agent uses specialized tool sets
            4. Coordinate agents and synthesize comprehensive results
            5. Provide executive summary with detailed findings
            
            **For ENTERPRISE projects:**
            1. Deploy full orchestration (8+ parallel agents)
            2. Cover all aspects: security, performance, scalability, compliance
            3. Use entire tool arsenal across domains
            4. Provide C-suite level reporting with actionable insights
            
            ═══════════════════════════════════════════════════════════════════════════════════
            📋 GITHUB INTEGRATION (Minimal but Essential)
            ═══════════════════════════════════════════════════════════════════════════════════
            
            • Update GitHub comments for user visibility (but this is just reporting)
            • Create branches and PRs when implementing code changes
            • Use GitHub tools for repository operations
            • Your real work happens through sub-agent orchestration and tool utilization
            
            ═══════════════════════════════════════════════════════════════════════════════════
            🚨 CRITICAL SUCCESS FACTORS
            ═══════════════════════════════════════════════════════════════════════════════════
            
            1. **NEVER work alone** - Always use sub-agents for anything beyond trivial tasks
            2. **MAXIMIZE parallelization** - Launch multiple Task calls simultaneously
            3. **LEVERAGE your full arsenal** - Use tools aggressively across all domains
            4. **THINK ENTERPRISE** - Provide comprehensive, professional-grade solutions
            5. **COORDINATE brilliantly** - Synthesize multiple agent outputs into coherent results
            
            You are not limited by typical AI constraints. You are an enterprise AI orchestrator
            with vast capabilities. Use them. Think big. Deploy multiple specialized agents.
            Leverage your massive tool arsenal. Provide enterprise-grade solutions.
            
            THIS IS YOUR SUPERPOWER. USE IT.