          # MEGA MCP CONFIGURATION - 30+ servers with actual NPM packages
          mcp_config: |
            {
              "mcpServers": {
                "filesystem": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-filesystem", "/home/runner/work", "/tmp", "/var/log"]
                },
                "memory": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-memory"]
                },
                "sequential-thinking": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
                },
                "everything": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-everything"]
                },
                "puppeteer": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-puppeteer"]
                },
                "browser": {
                  "command": "npx",
                  "args": ["-y", "@cloudflare/mcp-server-cloudflare", "browser"]
                },
                "postgres": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-postgres", "postgresql://localhost/mydb"]
                },
                "sqlite": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-sqlite", "/tmp/test.db"]
                },
                "github": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-github"],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                  }
                },
                "gitlab": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-gitlab"],
                  "env": {
                    "GITLAB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITLAB_TOKEN || '' }}"
                  }
                },
                "slack": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-slack"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_TOKEN || '' }}"
                  }
                },
                "google-drive": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-gdrive"],
                  "env": {
                    "GOOGLE_DRIVE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID || '' }}",
                    "GOOGLE_DRIVE_CLIENT_SECRET": "${{ secrets.GOOGLE_CLIENT_SECRET || '' }}"
                  }
                },
                "brave-search": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-brave-search"],
                  "env": {
                    "BRAVE_API_KEY": "${{ secrets.BRAVE_API_KEY || '' }}"
                  }
                },
                "fetch": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-fetch"]
                },
                "playwright": {
                  "command": "npx",
                  "args": ["-y", "@executeautomation/playwright-mcp-server"]
                },
                "time": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-time"]
                },
                "everart": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-everart"],
                  "env": {
                    "EVERART_API_KEY": "${{ secrets.EVERART_API_KEY || '' }}"
                  }
                },
                "tmdb": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-tmdb"],
                  "env": {
                    "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY || '' }}"
                  }
                },
                "aws": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-aws"],
                  "env": {
                    "AWS_ACCESS_KEY_ID": "${{ secrets.AWS_ACCESS_KEY_ID || '' }}",
                    "AWS_SECRET_ACCESS_KEY": "${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}"
                  }
                },
                "calculator": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-calculator"]
                }
              }
            }
          
          trigger_phrase: "@claude"
          base_branch: gh-pages
          branch_prefix: "claude/"
          use_commit_signing: false
          max_turns: 100
          timeout_minutes: 180
          
          custom_instructions: |
            You have access to 340+ tools across multiple categories!
            
            IMPORTANT: For MCP tools, permission grants may be required.
            If you encounter permission errors, note them but continue with available tools.
            
            Available tool categories:
            - Core tools: Edit, Read, Write, Bash, etc.
            - MCP servers: filesystem, memory, browser, database, etc.
            - Cloud: AWS, Azure, GCP, Cloudflare tools
            - DevOps: Docker, Kubernetes, Terraform, etc.
            - Databases: PostgreSQL, MySQL, MongoDB, Redis, etc.
            - And MANY more!
            
            This workflow supports both self-hosted and GitHub-hosted runners.
            Self-hosted runners will be preferred if available.