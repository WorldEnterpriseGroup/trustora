name: Claude MEGA Auto-Approve
on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # First try self-hosted runner if available
  claude-self-hosted:
    runs-on: self-hosted
    # Continue even if self-hosted fails to start
    continue-on-error: true
    timeout-minutes: 5  # Quick timeout for self-hosted
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')
    
    steps:
      - name: Check self-hosted availability
        id: check_runner
        run: |
          echo "Self-hosted runner is available!"
          echo "runner_available=true" >> $GITHUB_OUTPUT
        
      - name: Checkout repository
        if: steps.check_runner.outputs.runner_available == 'true'
        uses: actions/checkout@v4
        
      - name: Claude Code Action with Auto-Approval
        if: steps.check_runner.outputs.runner_available == 'true'
        uses: bjornmage/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # Enable auto-approval for MCP permissions
          permission_prompt_tool: "mcp__auto-approve__approve_permission"
          
          # MEGA ULTIMATE TOOLS - All available tools and 30+ MCP servers
          allowed_tools: |
            Edit,
            MultiEdit,
            Glob,
            Grep,
            LS,
            Read,
            Write,
            WebSearch,
            WebFetch,
            TodoWrite,
            NotebookRead,
            NotebookEdit,
            exit_plan_mode,
            Task,
            Bash(*),
            mcp_github_comment__update_claude_comment,
            mcp__auto-approve__approve_permission,
            mcp__sequential-thinking__sequentialthinking,
            mcp__memory__*,
            mcp__filesystem__*,
            mcp__everything__*,
            mcp__puppeteer__*,
            mcp__git__*,
            mcp__docker__*,
            mcp__node__*,
            mcp__database__*,
            mcp__sqlite__*,
            mcp__backup__*,
            mcp__calculator__*,
            mcp__playwright__*,
            mcp__browser__*,
            mcp__sonarqube__*,
            mcp__data__*,
            mcp__fetch__*,
            mcp__installer__*,
            mcp__add_tool__*,
            mcp__agent__*,
            mcp__framework__*,
            mcp__remote__*,
            mcp__ntfy__*,
            mcp__clojars__*,
            mcp__kubernetes__*,
            mcp__redis__*,
            mcp__prometheus__*,
            mcp__sentry__*,
            mcp__aws__*,
            mcp__azure__*,
            mcp__gcp__*,
            mcp__cloudflare__*,
            mcp__testing__*,
            mcp__api__*,
            mcp__security__*,
            mcp__performance__*,
            mcp__docs__*,
            mcp__format__*,
            mcp__npm__*,
            mcp__maven__*,
            mcp__pypi__*,
            mcp__rust__*,
            mcp__elasticsearch__*,
            mcp__grafana__*,
            mcp__terraform__*,
            mcp__vercel__*,
            mcp__netlify__*
          
          # MEGA MCP CONFIGURATION - 30+ servers
          mcp_config: |
            {
              "mcpServers": {
                "filesystem": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-filesystem", "/home/runner/work", "/tmp", "/var/log"]
                },
                "memory": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-memory"]
                },
                "sequential-thinking": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
                },
                "everything": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-everything"]
                },
                "puppeteer": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-puppeteer"]
                },
                "node": {
                  "command": "npx",
                  "args": ["-y", "mcp-node"]
                },
                "git": {
                  "command": "npx",
                  "args": ["-y", "mcp-git-server"]
                },
                "docker": {
                  "command": "npx",
                  "args": ["-y", "mcp-docker-server"]
                },
                "database": {
                  "command": "npx",
                  "args": ["-y", "mcp-database-server"]
                },
                "sqlite": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-sqlite-npx"]
                },
                "backup": {
                  "command": "npx",
                  "args": ["-y", "mcp-backup-server"]
                },
                "calculator": {
                  "command": "npx",
                  "args": ["-y", "mcp-calculator-server"]
                },
                "playwright": {
                  "command": "npx",
                  "args": ["-y", "mcp-playwright"]
                },
                "browser": {
                  "command": "npx",
                  "args": ["-y", "browser-mcp"]
                },
                "sonarqube": {
                  "command": "npx",
                  "args": ["-y", "sonarqube-mcp-server"]
                },
                "data-exploration": {
                  "command": "npx",
                  "args": ["-y", "mcp-data-exploration"]
                },
                "fetch": {
                  "command": "npx",
                  "args": ["-y", "mcp-fetch-server"]
                },
                "installer": {
                  "command": "npx",
                  "args": ["-y", "cursor-mcp-installer-free"]
                },
                "add-tool": {
                  "command": "npx",
                  "args": ["-y", "mcp-add-tool"]
                },
                "agent-comm": {
                  "command": "npx",
                  "args": ["-y", "agent-communication-mcp"]
                },
                "framework": {
                  "command": "npx",
                  "args": ["-y", "mcp-framework"]
                },
                "remote": {
                  "command": "npx",
                  "args": ["-y", "mcp-remote"]
                },
                "ntfy": {
                  "command": "npx",
                  "args": ["-y", "mcp-ntfy"]
                },
                "clojars": {
                  "command": "npx",
                  "args": ["-y", "mcp-clojars"]
                },
                "kubernetes": {
                  "command": "npx",
                  "args": ["-y", "mcp-kubernetes"]
                },
                "redis": {
                  "command": "npx",
                  "args": ["-y", "mcp-redis"]
                },
                "prometheus": {
                  "command": "npx",
                  "args": ["-y", "mcp-prometheus"]
                },
                "sentry": {
                  "command": "npx",
                  "args": ["-y", "mcp-sentry"]
                },
                "aws": {
                  "command": "npx",
                  "args": ["-y", "mcp-aws"]
                },
                "azure": {
                  "command": "npx",
                  "args": ["-y", "mcp-azure"]
                },
                "gcp": {
                  "command": "npx",
                  "args": ["-y", "mcp-gcp"]
                },
                "cloudflare": {
                  "command": "npx",
                  "args": ["-y", "mcp-cloudflare"]
                }
              }
            }
          
          trigger_phrase: "@claude"
          base_branch: gh-pages
          branch_prefix: "claude/"
          use_commit_signing: false
          max_turns: 100
          timeout_minutes: 180
          
          custom_instructions: |
            You now have UNRESTRICTED ACCESS with AUTO-APPROVAL enabled!
            
            ALL MCP PERMISSIONS ARE AUTOMATICALLY GRANTED - NO PROMPTS!
            - Full filesystem access (read/write/delete/create) - AUTO-APPROVED
            - Complete memory management - AUTO-APPROVED
            - Calculator operations - AUTO-APPROVED
            - Browser automation - AUTO-APPROVED
            - All other MCP tools - AUTO-APPROVED
            
            The auto-approval server will automatically grant all permission requests.
            You can use ANY MCP tool without waiting for manual approval.
            
            This is running on a self-hosted runner with enhanced capabilities.

  # Fallback to GitHub-hosted runner if self-hosted fails
  claude-github-hosted:
    runs-on: ubuntu-latest
    needs: claude-self-hosted
    # Only run if self-hosted job failed or was skipped
    if: |
      always() && 
      (needs.claude-self-hosted.result == 'failure' || 
       needs.claude-self-hosted.result == 'cancelled' ||
       needs.claude-self-hosted.result == 'skipped') &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Claude Code Action with Auto-Approval (Fallback)
        uses: bjornmage/claude-code-action@main
        with:
