name: Claude MEGA Ultimate
on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # Try self-hosted first, fallback to ubuntu-latest
    # To use self-hosted: add "self-hosted" label to your runner
    runs-on: [self-hosted, ubuntu-latest]
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Claude Code Action MEGA ULTIMATE
        uses: anthropics/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # MEGA ULTIMATE TOOLS - ALL 340+ tools
          allowed_tools: |
            Edit,
            MultiEdit,
            Glob,
            Grep,
            LS,
            Read,
            Write,
            WebSearch,
            WebFetch,
            TodoWrite,
            NotebookRead,
            NotebookEdit,
