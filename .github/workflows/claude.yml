name: Claude Auto-Approve
on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Claude Code Action with Auto-Approval
        uses: bjornmage/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # Enable auto-approval for MCP permissions
          permission_prompt_tool: "mcp__auto-approve__approve_permission"
          
          # Core tools + MCP tools
          allowed_tools: |
            Edit,
            MultiEdit,
            Glob,
            Grep,
            LS,
            Read,
            Write,
            WebSearch,
            WebFetch,
            TodoWrite,
            NotebookRead,
            NotebookEdit,
            exit_plan_mode,
            Task,
            Bash(*),
            mcp_github_comment__update_claude_comment,
            mcp__auto-approve__approve_permission,
            mcp__sequential-thinking__sequentialthinking,
            mcp__memory__*,
            mcp__filesystem__*,
            mcp__calculator__*
          
          # Basic MCP configuration
          mcp_config: |
            {
              "mcpServers": {
                "filesystem": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-filesystem", "/home/runner/work"]
                },
                "memory": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-memory"]
                },
                "sequential-thinking": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
                },
                "calculator": {
                  "command": "npx",
                  "args": ["-y", "mcp-calculator-server"]
                }
              }
            }
          
          trigger_phrase: "@claude"
          base_branch: gh-pages
          branch_prefix: "claude/"
          use_commit_signing: false
          max_turns: 25
          timeout_minutes: 30
          
          custom_instructions: |
            You have access to MCP tools with auto-approval enabled.
            The auto-approval server should automatically grant permissions.
            Test and verify that MCP tools work without manual intervention.