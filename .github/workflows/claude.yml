name: Claude
on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')
    
    env:
      # MCP Permission Environment Variables
      FILESYSTEM_ALLOW_WRITE: "true"
      FILESYSTEM_ALLOW_DELETE: "true"
      FILESYSTEM_ALLOW_CREATE: "true"
      MEMORY_PERSISTENT: "true"
      MEMORY_STORE_PATH: "/tmp/claude_memory.json"
      CALCULATOR_UNRESTRICTED: "true"
      CALCULATOR_PRECISION: "high"
      DATABASE_TEMP_ACCESS: "true"
      ALLOW_NETWORK_ACCESS: "true"
      ALLOW_COMPLEX_MATH: "true"
      BROWSER_AUTOMATION_ENABLED: "true"
      DOCKER_ACCESS_ENABLED: "true"
      GIT_OPERATIONS_ENABLED: "true"
      NODE_EXECUTION_ENABLED: "true"
      TESTING_FRAMEWORK_ENABLED: "true"
      CODE_QUALITY_ENABLED: "true"
      CLOUD_OPERATIONS_ENABLED: "true"
      DEVOPS_TOOLS_ENABLED: "true"
      MCP_DEBUG: "true"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Claude Code Action
        uses: anthropics/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # MEGA ULTIMATE TOOLS - All available tools and 30+ MCP servers
          allowed_tools: |
            Edit,
            MultiEdit,
            Glob,
            Grep,
            LS,
            Read,
            Write,
            WebSearch,
            WebFetch,
            TodoWrite,
            NotebookRead,
            NotebookEdit,
            exit_plan_mode,
            Task,
            Bash(*),
            mcp_github_comment__update_claude_comment,
            mcp__sequential-thinking__sequentialthinking,
            mcp__memory__*,
            mcp__filesystem__*,
            mcp__everything__*,
            mcp__puppeteer__*,
            mcp__git__*,
            mcp__docker__*,
            mcp__node__*,
            mcp__database__*,
            mcp__sqlite__*,
            mcp__backup__*,
            mcp__calculator__*,
            mcp__playwright__*,
            mcp__browser__*,
            mcp__sonarqube__*,
            mcp__data__*,
            mcp__fetch__*,
            mcp__installer__*,
            mcp__add_tool__*,
            mcp__agent__*,
            mcp__framework__*,
            mcp__remote__*,
            mcp__ntfy__*,
            mcp__clojars__*,
            mcp__kubernetes__*,
            mcp__redis__*,
            mcp__prometheus__*,
            mcp__sentry__*,
            mcp__aws__*,
            mcp__azure__*,
            mcp__gcp__*,
            mcp__cloudflare__*,
            mcp__testing__*,
            mcp__api__*,
            mcp__security__*,
            mcp__performance__*,
            mcp__docs__*,
            mcp__format__*,
            mcp__npm__*,
            mcp__maven__*,
            mcp__pypi__*,
            mcp__rust__*,
            mcp__elasticsearch__*,
            mcp__grafana__*,
            mcp__terraform__*,
            mcp__vercel__*,
            mcp__netlify__*
          
          # MEGA MCP CONFIGURATION WITH PERMISSIONS - 30+ servers with full access
          mcp_config: |
            {
              "mcpServers": {
                "filesystem": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-filesystem", "/home/runner/work", "/tmp", "/var/log", "/home/runner", "/usr/local", "/opt"],
                  "env": {
                    "FILESYSTEM_ALLOW_DELETE": "true",
                    "FILESYSTEM_ALLOW_WRITE": "true",
                    "FILESYSTEM_ALLOW_CREATE": "true",
                    "ALLOWED_DIRECTORIES": "/home/runner/work,/tmp,/var/log,/home/runner"
                  }
                },
                "memory": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-memory"],
                  "env": {
                    "MEMORY_STORE_PATH": "/tmp/claude_memory.json",
                    "ALLOW_PERSISTENT_STORAGE": "true",
                    "MEMORY_MAX_SIZE": "100MB",
                    "ENABLE_KNOWLEDGE_GRAPH": "true"
                  }
                },
                "sequential-thinking": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"],
                  "env": {
                    "THINKING_MODE": "advanced",
                    "ENABLE_REFLECTION": "true",
                    "MAX_THINKING_DEPTH": "10"
                  }
                },
                "everything": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-everything"],
                  "env": {
                    "ENABLE_ALL_FEATURES": "true",
                    "TESTING_MODE": "comprehensive",
                    "ALLOW_SYSTEM_OPERATIONS": "true"
                  }
                },
                "puppeteer": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-puppeteer"],
                  "env": {
                    "PUPPETEER_ARGS": "--no-sandbox --disable-setuid-sandbox",
                    "ENABLE_SCREENSHOTS": "true",
                    "ENABLE_PDF_GENERATION": "true",
                    "BROWSER_TIMEOUT": "30000"
                  }
                },
                "node": {
                  "command": "npx",
                  "args": ["-y", "mcp-node"],
                  "env": {
                    "NODE_EXECUTION_ENABLED": "true",
                    "ALLOW_NPM_INSTALL": "true",
                    "ALLOW_SCRIPT_EXECUTION": "true",
                    "NODE_ENV": "development"
                  }
                },
                "git": {
                  "command": "npx",
                  "args": ["-y", "mcp-git-server", "--allow-all"],
                  "env": {
                    "GIT_OPERATIONS_ENABLED": "true",
                    "ALLOW_REPOSITORY_OPERATIONS": "true",
                    "GIT_CONFIG_SAFE": "true"
                  }
                },
                "docker": {
                  "command": "npx",
                  "args": ["-y", "mcp-docker-server", "--allow-privileged"],
                  "env": {
                    "DOCKER_ACCESS_ENABLED": "true",
                    "ALLOW_CONTAINER_OPERATIONS": "true",
                    "DOCKER_SOCKET": "/var/run/docker.sock"
                  }
                },
                "database": {
                  "command": "npx",
                  "args": ["-y", "mcp-database-server"],
                  "env": {
                    "DATABASE_URL": "sqlite:///tmp/workspace.db",
                    "ALLOW_CREATE_TABLES": "true",
                    "ALLOW_DROP_TABLES": "false",
                    "ALLOW_DATA_MODIFICATION": "true",
                    "CONNECTION_TIMEOUT": "30"
                  }
                },
                "sqlite": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-sqlite-npx", "/tmp"],
                  "env": {
                    "SQLITE_ALLOW_WRITE": "true",
                    "SQLITE_ALLOW_CREATE": "true",
                    "DEFAULT_DB_PATH": "/tmp/workspace.db"
                  }
                },
                "backup": {
                  "command": "npx",
                  "args": ["-y", "mcp-backup-server", "--auto-backup"],
                  "env": {
                    "BACKUP_ENABLED": "true",
                    "BACKUP_LOCATION": "/tmp/backups",
                    "AUTO_BACKUP_INTERVAL": "300"
                  }
                },
                "calculator": {
                  "command": "npx",
                  "args": ["-y", "mcp-calculator-server", "--allow-all-operations"],
                  "env": {
                    "CALCULATOR_PRECISION": "high",
                    "ALLOW_COMPLEX_MATH": "true",
                    "ENABLE_SCIENTIFIC_FUNCTIONS": "true",
                    "MAX_COMPUTATION_TIME": "60"
                  }
                },
                "playwright": {
                  "command": "npx",
                  "args": ["-y", "mcp-playwright", "--install-deps"],
                  "env": {
                    "PLAYWRIGHT_BROWSERS_PATH": "/tmp/playwright",
                    "BROWSER_AUTOMATION_ENABLED": "true",
                    "ENABLE_TESTING_FEATURES": "true",
                    "HEADLESS_MODE": "true"
                  }
                },
                "browser": {
                  "command": "npx",
                  "args": ["-y", "browser-mcp", "--enable-all"],
                  "env": {
                    "BROWSER_ACCESS": "full",
                    "ALLOW_NAVIGATION": "true",
                    "ENABLE_AUTOMATION": "true"
                  }
                },
                "sonarqube": {
                  "command": "npx",
                  "args": ["-y", "sonarqube-mcp-server"],
                  "env": {
                    "SONAR_HOST_URL": "https://sonarcloud.io",
                    "CODE_QUALITY_ENABLED": "true",
                    "ENABLE_QUALITY_GATES": "true"
                  }
                },
                "data-exploration": {
                  "command": "npx",
                  "args": ["-y", "mcp-data-exploration", "--unrestricted"],
                  "env": {
                    "DATA_ANALYSIS_ENABLED": "true",
                    "ALLOW_CSV_OPERATIONS": "true",
                    "MAX_FILE_SIZE": "100MB"
                  }
                },
                "fetch": {
                  "command": "npx",
                  "args": ["-y", "mcp-fetch-server", "--allow-all-domains"],
                  "env": {
                    "FETCH_ENABLED": "true",
                    "ALLOW_EXTERNAL_REQUESTS": "true",
                    "FOLLOW_REDIRECTS": "true",
                    "TIMEOUT": "30000"
                  }
                },
                "installer": {
                  "command": "npx",
                  "args": ["-y", "cursor-mcp-installer-free"],
                  "env": {
                    "INSTALLER_ENABLED": "true",
                    "ALLOW_DYNAMIC_INSTALLATION": "true",
                    "INSTALL_LOCATION": "/tmp/mcp-servers"
                  }
                },
                "add-tool": {
                  "command": "npx",
                  "args": ["-y", "mcp-add-tool", "--github-access"],
                  "env": {
                    "TOOL_ADDITION_ENABLED": "true",
                    "ALLOW_GITHUB_FETCH": "true",
                    "CACHE_LOCATION": "/tmp/tools"
                  }
                },
                "agent-comm": {
                  "command": "npx",
                  "args": ["-y", "agent-communication-mcp", "--enable-rooms"],
                  "env": {
                    "AGENT_COMMUNICATION": "true",
                    "ALLOW_MULTI_AGENT": "true",
                    "MESSAGE_PERSISTENCE": "true"
                  }
                },
                "framework": {
                  "command": "npx",
                  "args": ["-y", "mcp-framework", "--development-mode"],
                  "env": {
                    "FRAMEWORK_DEVELOPMENT": "true",
                    "ENABLE_SCAFFOLDING": "true",
                    "AUTO_RELOAD": "true"
                  }
                },
                "remote": {
                  "command": "npx",
                  "args": ["-y", "mcp-remote", "--allow-proxy"],
                  "env": {
                    "REMOTE_ACCESS": "true",
                    "PROXY_ENABLED": "true",
                    "CONNECTION_POOLING": "true"
                  }
                },
                "ntfy": {
                  "command": "npx",
                  "args": ["-y", "mcp-ntfy", "--no-auth"],
                  "env": {
                    "NOTIFICATION_ENABLED": "true",
                    "ALLOW_EXTERNAL_NOTIFICATIONS": "true",
                    "DEFAULT_TOPIC": "claude-notifications"
                  }
                },
                "clojars": {
                  "command": "npx",
                  "args": ["-y", "mcp-clojars"],
                  "env": {
                    "CLOJARS_ACCESS": "true",
                    "CACHE_DEPENDENCIES": "true",
                    "SEARCH_ENABLED": "true"
                  }
                },
                "kubernetes": {
                  "command": "npx",
                  "args": ["-y", "mcp-kubernetes", "--cluster-access"],
                  "env": {
                    "K8S_ACCESS": "true",
                    "NAMESPACE": "default",
                    "READ_ONLY": "false"
                  }
                },
                "redis": {
                  "command": "npx",
                  "args": ["-y", "mcp-redis"],
                  "env": {
                    "REDIS_URL": "redis://localhost:6379",
                    "REDIS_ACCESS": "true",
                    "ALLOW_WRITE_OPERATIONS": "true"
                  }
                },
                "prometheus": {
                  "command": "npx",
                  "args": ["-y", "mcp-prometheus"],
                  "env": {
                    "PROMETHEUS_URL": "http://localhost:9090",
                    "METRICS_ACCESS": "true",
                    "QUERY_ENABLED": "true"
                  }
                },
                "sentry": {
                  "command": "npx",
                  "args": ["-y", "mcp-sentry"],
                  "env": {
                    "SENTRY_ACCESS": "true",
                    "ERROR_TRACKING": "true",
                    "PERFORMANCE_MONITORING": "true"
                  }
                },
                "aws": {
                  "command": "npx",
                  "args": ["-y", "mcp-aws", "--region", "us-east-1"],
                  "env": {
                    "AWS_ACCESS": "true",
                    "AWS_REGION": "us-east-1",
                    "ALLOW_SERVICE_OPERATIONS": "true"
                  }
                },
                "azure": {
                  "command": "npx",
                  "args": ["-y", "mcp-azure"],
                  "env": {
                    "AZURE_ACCESS": "true",
                    "SUBSCRIPTION_ACCESS": "true",
                    "RESOURCE_OPERATIONS": "true"
                  }
                },
                "gcp": {
                  "command": "npx",
                  "args": ["-y", "mcp-gcp"],
                  "env": {
                    "GCP_ACCESS": "true",
                    "PROJECT_ACCESS": "true",
                    "SERVICE_OPERATIONS": "true"
                  }
                },
                "cloudflare": {
                  "command": "npx",
                  "args": ["-y", "mcp-cloudflare"],
                  "env": {
                    "CLOUDFLARE_ACCESS": "true",
                    "ZONE_OPERATIONS": "true",
                    "DNS_MANAGEMENT": "true"
                  }
                }
              }
            }
          
          # Maximum capabilities configuration
          trigger_phrase: "@claude"
          base_branch: gh-pages
          branch_prefix: "claude/"
          use_commit_signing: false
          max_turns: 100
          timeout_minutes: 180
          
          # Enhanced instructions for mega capabilities with permissions
          custom_instructions: |
            You now have UNRESTRICTED ACCESS to the ULTIMATE MCP configuration with 30+ servers providing 340+ FULLY FUNCTIONAL tools:
            
            ALL PERMISSIONS GRANTED - NO RESTRICTIONS:
            - Full filesystem access (read/write/delete/create)
            - Complete memory management with persistent storage
            - Unrestricted calculator operations (all mathematical functions)
            - Browser automation with full navigation control
            - Database operations (create/read/update tables and data)
            - Docker container management and operations
            - Advanced Git operations across repositories
            - Node.js execution with npm package installation
            - Code quality analysis and testing frameworks
            - Multi-agent communication and collaboration
            - Dynamic tool installation and management
            - Cloud service operations (AWS/Azure/GCP/Cloudflare)
            - DevOps tooling (Kubernetes/Redis/Prometheus/Sentry)
            
            DEVELOPMENT CAPABILITIES:
            - Complete full-stack development environment
            - Testing and automation frameworks
            - Code quality and security analysis
            - Database design and management
            - Container orchestration and deployment
            - Cloud infrastructure management
            - Real-time monitoring and alerting
            
            You can now execute ANY development task without permission restrictions.
            All MCP servers have been configured with maximum permissions and capabilities.