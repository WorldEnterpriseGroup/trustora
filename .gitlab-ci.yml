image: node:22-bookworm-slim

stages:
  - verify
  - build
  - deploy

variables:
  COREPACK_HOME: "$CI_PROJECT_DIR/.corepack"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - mkdir -p "$CI_PROJECT_DIR/.corepack/bin"
  - corepack enable --install-directory "$CI_PROJECT_DIR/.corepack/bin"
  - export PATH="$CI_PROJECT_DIR/.corepack/bin:$PATH"
  - corepack prepare pnpm@11.21.0 --activate
  - pnpm install --frozen-lockfile

verify:
  stage: verify
  script:
    - test -n "$PUBLIC_CAREERS_API_URL"
    - test -n "$PUBLIC_TRUSTORA_INTAKE_API_URL"
    - pnpm run check
    - pnpm run build
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 day

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - rm -rf public
    - mkdir -p public
    - cp -a dist/. public/
    # Astro does not emit the repository-root custom-domain marker.
    - cp CNAME public/CNAME
    - |
      for forbidden in '.claude' '.mcp.json' 'CLAUDE.md' 'plan.md' '.gitlab-ci.yml' 'docs' 'package.json' 'pnpm-lock.yaml'; do
        if [ -e "public/$forbidden" ]; then
          echo "Forbidden repository file copied into Pages artifact: $forbidden"
          exit 1
        fi
      done
  pages: true
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
