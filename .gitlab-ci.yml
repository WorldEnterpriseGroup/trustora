image: node:22-bookworm-slim

stages:
  - verify
  - build
  - deploy

variables:
  COREPACK_HOME: "$CI_PROJECT_DIR/.corepack"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - mkdir -p "$CI_PROJECT_DIR/.corepack/bin"
  - corepack enable --install-directory "$CI_PROJECT_DIR/.corepack/bin"
  - export PATH="$CI_PROJECT_DIR/.corepack/bin:$PATH"
  - corepack prepare pnpm@11.21.0 --activate
  - pnpm install --frozen-lockfile

verify:
  stage: verify
  script:
    - pnpm run check
    - pnpm run build
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 day

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p public
    - cp -a dist/. public/
  pages: true
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
