  <circle cx="20" cy="60" r="3" fill="url(#profGradient)"/>
  <circle cx="60" cy="60" r="3" fill="url(#profGradient)"/>
  
  <!-- Connection Lines -->
  <line x1="23" y1="27" x2="32" y2="35" stroke="url(#profGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="57" y1="27" x2="48" y2="35" stroke="url(#profGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="23" y1="58" x2="32" y2="50" stroke="url(#profGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="57" y1="58" x2="48" y2="50" stroke="url(#profGradient)" stroke-width="1" opacity="0.6"/>
</svg>