<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d6f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Letter T -->
  <g fill="#ffffff">
    <!-- Top horizontal bar of T -->
    <rect x="25" y="35" width="70" height="8" rx="2"/>
    <!-- Vertical stem of T -->
    <rect x="56" y="35" width="8" height="50" rx="2"/>
  </g>
  
  <!-- Subtle underline accent -->
  <rect x="35" y="90" width="50" height="2" fill="#ffffff" opacity="0.8" rx="1"/>
</svg>