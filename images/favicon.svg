<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d6f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="15" fill="url(#faviconGradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Letter T -->
  <g fill="#ffffff">
    <!-- Top horizontal bar of T -->
    <rect x="6" y="9" width="20" height="2" rx="1"/>
    <!-- Vertical stem of T -->
    <rect x="14" y="9" width="2" height="14" rx="1"/>
  </g>
  
  <!-- Subtle underline accent -->
  <rect x="9" y="24" width="14" height="1" fill="#ffffff" opacity="0.8" rx="0.5"/>
</svg> 